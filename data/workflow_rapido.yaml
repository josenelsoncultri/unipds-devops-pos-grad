name: CI Checkout Service
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Cache de dependências npm - economia: ~30-60 segundos
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            ${{ runner.os }}-

      - uses: actions/checkout@v4

      # Setup Node.js com versão específica - reprodutibilidade
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # Cache automático do npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm ci  # Mais rápido que npm install com cache
        # Economia adicional: ~5-10 segundos (npm ci é mais rápido)

      - name: Build
        run: npm run build

      # Cache do diretório de build - economia: ~10-20 segundos
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ runner.os }}-build-${{ hashFiles('**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Run Tests
        run: npm test